name: Bug Report
description: Report a bug in temporal
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
  - type: input
    attributes:
      label: Image tag / commit
      description: The container image tag or commit SHA you're running
    validations:
      required: true
  - type: input
    attributes:
      label: Temporal Server version
      description: Output of `temporal server --version` or your Temporal Server deployment's version
